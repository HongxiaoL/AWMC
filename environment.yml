name: wbm-causal-agents
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - pymatgen
  - matminer
  - dowhy
  - econml
  - networkx
  - joblib
  - matplotlib
  - seaborn
  - pyyaml
  - python-dotenv
  - openai
  - anthropic
  - pip
  - mp-api
  - pip:
    - -r requirements.txt
